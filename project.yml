name: Kotoverlay
options:
  bundleIdPrefix: dev.niyy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KotoverlayPackage:
    path: .
targets:
  Kotoverlay:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: KotoverlayPackage
        product: KotoverlayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.niyy.Kotoverlay
        PRODUCT_NAME: Kotoverlay
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kotoverlay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Kotoverlay:
    shared: true
    build:
      targets:
        Kotoverlay: all
    run:
      config: Debug
    archive:
      config: Release
